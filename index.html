<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página de Eventos</title>
  <link rel="stylesheet" href="./assets/css/styles.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet">
</head>

<body>
  <nav class="header-menu">
    <img class="logo" alt="logotipo" title="Logotipo" src="./assets/images/logotipo.png" />
    <ul class="navigation">
      <li class="item">
        <a class="link active" href="eventos.html">Eventos</a>
      </li>
      <li class="item">
        <a class="link" href="categorias.html">Categorias</a>
      </li>
      <li class="item">
        <button class="call-to-action">Explorar Eventos</button>
      </li>
    </ul>
  </nav>

  <header class="hero">
    <h1 class="title">Onde sua turma <span class="highlight">encontra o próximo evento</span></h1>
    <p class="description">Aqui você encontra os melhores eventos da região</p>

    <input class="search" type="text" placeholder="Buscar por nome do evento..." />
  </header>

  <section class="events">
    <nav class="filter">
      <ul class="filter-list">
        <li class="item active">Todos</li>
        <li class="item">Workshop</li>
        <li class="item">Palestra</li>
        <li class="item">Hackathon</li>
        <li class="item">Meetup</li>
        <li class="item">Curso</li>
        <li class="item">Show</li>
      </ul>
    </nav>

    <section class="list">
      <article class="card">
        <p class="category">Workshop</p>
        <h3 class="title">HTML do Zero ao Avançado</h3>
        <p class="place">Bloco, sala 4</p>

        <section class="information">
          <span class="quantity">17 vagas restantes</span>
          <span class="percentage">57%</span>
        </section>

        <a class="link" href="#">Ver detalhes</a>
      </article>
    </section>
  </section>
</body>

</html>
